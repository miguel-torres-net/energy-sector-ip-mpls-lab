# sot/lab.yml

provider:
  asn: 65000
  vrf:
    name: CUST-A
    rd: 65000:100
    rt: 65000:100

nodes:
  pe1: { platform: junos, role: pe, loopback: 10.255.0.1/32, mgmt: { ip: 192.168.1.201/24, if: fxp0, gw: 192.168.1.1 } }
  p1:  { platform: frr,  role: p,  loopback: 10.255.0.2/32 }
  pe2: { platform: junos, role: pe, loopback: 10.255.0.3/32 }
  rr1: { platform: frr,  role: rr, loopback: 10.255.0.4/32 }
  ce1: { platform: frr,  role: ce, asn: 65101, lan: 192.168.10.0/24 }
  ce2: { platform: frr,  role: ce, asn: 65102, lan: 192.168.20.0/24 }

links:
  # core
  - a: { node: pe1, if: ge-0/0/0, ip: 10.0.0.0/31 }
    b: { node: p1,  if: eth1,     ip: 10.0.0.1/31 }

  - a: { node: p1,  if: eth2,     ip: 10.0.0.2/31 }
    b: { node: pe2, if: ge-0/0/0, ip: 10.0.0.3/31 }

  # rr stub
  - a: { node: p1,  if: eth3, ip: 10.0.0.4/31 }
    b: { node: rr1, if: eth1, ip: 10.0.0.5/31 }

  # access
  - a: { node: pe1, if: ge-0/0/1, ip: 172.16.10.1/30 }
    b: { node: ce1, if: eth1,     ip: 172.16.10.2/30 }

  - a: { node: pe2, if: ge-0/0/1, ip: 172.16.20.1/30 }
    b: { node: ce2, if: eth1,     ip: 172.16.20.2/30 }

iec104:
  outstation_host: { name: sub1, ip: 192.168.10.10, gw: 192.168.10.1 }
  master_host:     { name: cc1,  ip: 192.168.20.10, gw: 192.168.20.1 }
  tcp_port: 2404
